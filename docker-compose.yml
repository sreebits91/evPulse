services:
  db:
    image: postgres:16-alpine
    container_name: evpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evpulse
      POSTGRES_USER: evpulse
      POSTGRES_PASSWORD: evpulse
    ports:
      - "5432:5432"
    volumes:
      - evpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evpulse -d evpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evpulse-postgres:
