services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evpulse
      POSTGRES_USER: evpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evpulse-local-only}
    ports:
      - "5432:5432"
    volumes:
      - evpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evpulse -d evpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/evpulse
      DATABASE_USERNAME: evpulse
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-evpulse-local-only}
      OPENCHARGEMAP_API_KEY: ${OPENCHARGEMAP_API_KEY:-}
      PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  evpulse-postgres:
