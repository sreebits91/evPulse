spring:
  application:
    name: evpulse-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/evpulse}
    username: ${DATABASE_USERNAME:evpulse}
    password: ${DATABASE_PASSWORD:evpulse}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
