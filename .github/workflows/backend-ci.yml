name: CI

on:
  push:
    branches: [main, evpulse-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build

  container-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: evpulse-api:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8080/api/v1
          tags: evpulse-web:ci

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Start the complete Compose stack
        run: docker compose up --build --detach
      - name: Wait for API and frontend
        shell: bash
        run: |
          set -euo pipefail
          api_ready=false
          web_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/v1/health >/dev/null; then
              api_ready=true
            fi
            if curl --fail --silent http://localhost:3000/ >/dev/null; then
              web_ready=true
            fi
            if [[ "$api_ready" == "true" && "$web_ready" == "true" ]]; then
              echo "API and frontend are responding."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          echo "Timed out waiting for the full stack."
          exit 1
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
